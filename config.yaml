# =============================================================================
# CLW-HFL central configuration
# Every script in this repo loads this file (or a path passed via --config)
# instead of hardcoding hyperparameters. Override any field on the CLI where
# supported (see each script's --help).
# =============================================================================

paths:
  raw_train_csv: "data/UNSW_NB15_training-set.csv"
  raw_test_csv: "data/UNSW_NB15_testing-set.csv"
  processed_dir: "data/processed"
  label_map_path: "data/processed/label_map.json"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  figures_dir: "figures"

# Reproducibility: every reported number must be run at all of these seeds,
# with mean +/- std reported (Part 5, section 3.6).
seeds: [13, 42, 2024]

# Non-IID partitioning. alpha is the Dirichlet concentration parameter;
# smaller alpha => more non-IID (more skewed per-client class distributions).
# Part 1, section 1.3 requires a sensitivity check at >=1 additional alpha.
partitioning:
  default_alpha: 0.5
  sensitivity_alphas: [0.1, 1.0]

# Hardware-aware defaults (Part 1, section 0): keep batch size modest,
# keep the backbone small, keep rounds/epochs bounded so the full pipeline
# finishes in minutes-to-hours on a Dell Precision 3530 (CPU / ~4GB VRAM).
model:
  # Measured on the real, full UNSW-NB15 training/testing-set.csv files via
  # preprocess.py (39 numeric cols + one-hot of proto/service/state = 194).
  # Part 1 section 1.4 cites 196 from the literature, but that number came
  # from a different feature-engineering pipeline/category cardinality; we
  # use the actually-measured value here rather than forcing a mismatch.
  # Re-check this field any time preprocess.py is re-run against a different
  # UNSW-NB15 release -- "final feature dimension" in its console output
  # must always match this number exactly, or model.forward() will crash.
  input_dim: 194
  hidden_dims: [128, 64]

training:
  batch_size: 128
  local_epochs: 2
  rounds:
    layer_A: 30
    layer_B: 20
    layer_C: 15
    cloud: 15
  optimizer:
    name: "sgd"          # local client optimizer
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0001
  grad_clip_norm: 10.0
  focal_loss:
    gamma: 2.0            # Lin et al. 2017 focusing parameter
    beta: 0.9999           # Cui et al. 2019 effective-number-of-samples reweighting

clients:
  layer_A: 30
  layer_B: 10
  layer_C: 10
  client_fraction_per_round: 1.0   # fraction of clients sampled each round

# --- Cloud-level aggregation (Part 4) ---
fedopt:
  name: "fedadam"
  server_lr: 0.1
  beta1: 0.9
  beta2: 0.99
  tau: 0.001              # FedAdam adaptivity / numerical-stability constant

secure_aggregation:
  enabled: true
  protocol: "pairwise_mask"   # Bonawitz et al.-style pairwise additive masking
  mask_seed_bits: 128

differential_privacy:
  enabled: true
  clip_norm: 10.0           # per-client update clipping bound (sensitivity)
  noise_multiplier: 0.01    # sigma = noise_multiplier * clip_norm
  target_delta: 0.00001
  accountant: "rdp"        # Renyi-DP accountant, converted to (epsilon, delta)

paillier:
  enabled: true
  # Sizing derivation (must stay internally consistent -- see
  # common/paillier_utils.py:validate_packing_params, which asserts this at
  # runtime rather than silently overflowing):
  #   Each packed "slot" must hold a signed, quantized value AFTER it has
  #   been doubled in range (to make it non-negative via an offset) and
  #   summed across up to the largest client population we use (30). slot_bits=32
  #   gives generous headroom above the ~25 bits that actually requires.
  #   pack_batch_size=64 keeps 64*32=2048 bits comfortably under a 2048-bit
  #   Paillier modulus.
  key_size_bits: 2048
  quant_bits: 16            # fixed-point quantization bits per scalar before packing
  quant_scale: 65536        # 2^quant_bits, scale factor float -> fixed-point int
  quant_clip: 15.0           # clamp each pre-quantization value to [-quant_clip, quant_clip] before scaling, to bound slot_bits
  slot_bits: 32             # bits reserved per packed scalar inside one ciphertext
  pack_batch_size: 48       # number of quantized scalars packed per Paillier ciphertext (48*32=1536 bits, safe margin under the 2048-bit key)

ablation:
  # Order matters: this is the exact left-to-right sequence for Figure 7.
  stages:
    - "fedavg_baseline"
    - "+gradient_clipping"
    - "+secure_aggregation"
    - "+distributed_dp"
    - "+partial_he"   # = full CLW-HFL

runtime:
  device: "cpu"            # "cuda" if a CUDA build of torch + GPU is available
  subsample: null           # e.g. 0.1 to validate quickly on 10% of data; null = full dataset
